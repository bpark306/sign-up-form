<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Sign-up Form</title>
</head>
<body>
    <div id="splashscreen-section">
        <p id="credits">Photo by Brian Park</p>
    </div>
    <div id="signup-section">
        <div id="header">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
            <p>Sign up <i>now</i> to get started.</p>
            <p>You <i>know</i> you want to.</p>
        </div>
        <div id="banner">
            <p>Let's do this!</p>
            <form id="signup-form" action="https://httpbin.org/post" method="post">
                <div id="name_fields">
                    <div class="field">
                        <label for="first_name"> FIRST NAME </label>
                        <input type="text" name="first_name" id="first_name" required>
                    </div>
                    <div class="field">
                        <label for="last_name"> LAST NAME </label>
                        <input type="text" name="last_name" id="last_name" required>
                    </div>
                </div>

                <div id="contact_info_fields">
                    <div class="field">
                        <label for="email_name"> EMAIL </label>
                        <input type="email" name="email" id="email" required>
                    </div>
                    <div class="field">
                        <label for="phone"> PHONE NUMBER </label>
                        <input type="tel" name="phone" id="phone" required>
                    </div>
                </div>

                <div id="password_fields">
                    <div class="field">
                        <label for="password"> PASSWORD </label>
                        <input type="password" name="password" id="password" required autocomplete="new-password">
                    </div>
                    <div class="field">
                        <label for="confirm_password"> CONFIRM PASSWORD </label>
                        <input type="password" name="confirm_password" id="confirm_password" required autocomplete="new-password">
                    </div>
                </div>
            </form>
        </div>
        <div id="footer">
            <button id="create_account_button" type="submit" form="signup-form">Create Account</button>
            <p>Already have an account? <a href="">Log in</a></p>
        </div>
    </div>
</body>
</html>
